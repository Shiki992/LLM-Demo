<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northfield Sales Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/rep.css">
<script src="/icons.js"></script>
</head>
<body class="rep">

<header class="rep-top">
  <a class="logo" href="/rep">
    <svg width="30" height="30" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#234a3a"/><path d="M6 30l10-15 6 8 4-5 8 12z" fill="#f6f3ec"/><circle cx="29" cy="12" r="3" fill="#c8642c"/></svg>
    <span>Sales Desk<small>NORTHFIELD OUTFITTERS</small></span>
  </a>
  <div class="stats" id="stats"></div>
  <span class="spacer"></span>
  <span class="live" id="live"><span class="dot"></span> Live</span>
  <a class="btn sm" href="/" target="_blank">Storefront ↗</a>
  <a class="btn sm" id="n8nLink" href="http://localhost:5678" target="_blank">n8n ↗</a>
  <button class="btn sm ghost" id="reset">Reset demo</button>
</header>

<main class="board">
  <section class="lane" data-lane="flight">
    <header><h3>In flight</h3><span class="lane-sub">n8n is working on these</span><span class="n"></span></header>
    <div class="cards"></div>
  </section>
  <section class="lane" data-lane="approval">
    <header><h3>Needs approval</h3><span class="lane-sub">Hot + cart · AI drafted outreach</span><span class="n"></span></header>
    <div class="cards"></div>
  </section>
  <section class="lane" data-lane="rep">
    <header><h3>Rep queue</h3><span class="lane-sub">Hot, no cart · call today</span><span class="n"></span></header>
    <div class="cards"></div>
  </section>
  <section class="lane" data-lane="nurture">
    <header><h3>Nurture</h3><span class="lane-sub">Warm or cold · automated</span><span class="n"></span></header>
    <div class="cards"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer wide" id="detail" aria-label="Ticket detail"></aside>
<div class="toast" id="toast"></div>

<script src="/rep.js"></script>
</body>
</html>
